<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <title>Biliar 3D HP</title>
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <style>
    :root {
      --bg: #14120f;
      --ink: #efe8d6;
      --mut: #a79d86;
      --brass: #c9a45c;
      --scrim: rgba(14, 12, 9, .9);
      --glass: rgba(14, 12, 9, .55);
      --sl: max(12px, env(safe-area-inset-left));
      --sr: max(12px, env(safe-area-inset-right));
      --sb: max(12px, env(safe-area-inset-bottom));
      --st: max(8px, env(safe-area-inset-top));
      color-scheme: dark;
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      overscroll-behavior: none;
      font: 13px/1.35 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none
    }

    canvas {
      display: block;
      touch-action: none
    }

    #hud {
      position: fixed;
      left: var(--sl);
      top: var(--st);
      pointer-events: none;
      text-shadow: 0 1px 6px #000;
      max-width: 52vw;
      font-size: 12.5px
    }

    #hud b {
      color: var(--brass);
      font-weight: 600
    }

    .c {
      position: fixed;
      touch-action: none
    }

    #spin {
      left: var(--sl);
      bottom: var(--sb);
      width: 84px;
      height: 84px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px var(--brass)
    }

    .rb {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 50%;
      background: var(--glass);
      bottom: calc(var(--sb) + 18px)
    }

    #fl {
      left: calc(var(--sl) + 100px)
    }

    #fr {
      left: calc(var(--sl) + 156px)
    }

    #pw {
      right: var(--sr);
      bottom: var(--sb);
      width: 56px;
      height: min(62vh, 230px);
      border: 2px solid var(--brass);
      border-radius: 28px;
      background: var(--glass)
    }

    #pw::before {
      content: "Daya";
      position: absolute;
      top: -20px;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--mut);
      font-size: 12px
    }

    #pf {
      position: absolute;
      inset: 0 0 auto 0;
      height: 0;
      background: var(--brass);
      border-radius: 26px
    }

    .sb {
      padding: 6px 14px;
      font-size: 12px;
      background: var(--glass)
    }

    #bz {
      right: var(--sr);
      top: var(--st)
    }

    #bc {
      right: calc(var(--sr) + 72px);
      top: var(--st)
    }

    #bp {
      left: 50%;
      transform: translateX(-50%);
      bottom: var(--sb);
      background: var(--brass);
      color: #14120f;
      padding: 10px 24px
    }

    .ov {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--scrim);
      text-align: center;
      padding: 8px 24px;
      overflow: auto
    }

    .ov h1 {
      font-size: clamp(30px, 11vh, 64px);
      font-weight: 500;
      letter-spacing: -.02em;
      margin: 0;
      line-height: 1
    }

    .ov p {
      margin: 0;
      color: var(--mut);
      max-width: 52ch
    }

    .bt {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center
    }

    button {
      font: inherit;
      color: var(--ink);
      background: none;
      border: 1px solid var(--brass);
      padding: 8px 18px;
      border-radius: 999px;
      cursor: pointer
    }

    button:active,
    button:focus-visible {
      background: var(--brass);
      color: #14120f;
      outline: none
    }

    label {
      color: var(--mut);
      font-size: 12px;
      display: inline-flex;
      gap: 6px;
      align-items: center
    }

    #rot {
      display: none;
      z-index: 20
    }

    @media (orientation:portrait) {
      #rot {
        display: flex
      }
    }

    .hide {
      display: none !important
    }
  </style>
</head>

<body>
  <div id="hud"></div>
  <canvas id="spin" class="c" width="184" height="184"></canvas>
  <button id="fl" class="c rb">◀</button><button id="fr" class="c rb">▶</button>
  <div id="pw" class="c">
    <div id="pf"></div>
  </div>
  <button id="bc" class="c sb">Kamera</button><button id="bz" class="c sb">Jeda</button>
  <button id="bp" class="c sb hide">Taruh bola</button>
  <div id="rot" class="ov">
    <h1>↻</h1>
    <p>Putar ponsel ke mode landscape untuk bermain.</p>
  </div>
  <div id="ov" class="ov"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    "use strict";
    const R = .028575, HX = 1.27, HZ = .635, G = 9.81, MS = .2, MR = .012, EB = .96, MB = .06, H = 1 / 480;

    /* ---------- scene ---------- */

    renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;

    const lamp = new THREE.SpotLight(0xfff0d8, 1.15, 0, .95, .7); lamp.position.set(0, 2.5, .2); lamp.castShadow = true; lamp.shadow.mapSize.set(1024, 1024); lamp.shadow.bias = -.0004; lamp.shadow.camera.near = 1; lamp.shadow.camera.far = 5; scene.add(lamp);

    const felt = new THREE.MeshStandardMaterial({ map: feltT, roughness: 1 }), cush = new THREE.MeshStandardMaterial({ color: 0x185a40, roughness: .95 }), wood = new THREE.MeshStandardMaterial({ map: woodT, roughness: .55 }), dark = new THREE.MeshBasicMaterial({ color: 0x050505 });
    function box(w, h, d, m, x, y, z) { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; scene.add(o); return o }
    box(2 * HX + .1, .04, 2 * HZ + .1, felt, 0, -.02, 0); box(2 * HX + .5, .2, 2 * HZ + .5, wood, 0, -.14, 0);
    for (const sz of [-1, 1]) {

      }
      box(.05, .036, 2 * (HZ - .09), cush, sz * (HX + .025), .018, 0)
    }
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({ color: 0x211b15, roughness: 1 })); floor.rotation.x = -Math.PI / 2; floor.position.y = -.84; floor.receiveShadow = true; scene.add(floor);
    const PK = []; for (const sx of [-1, 1]) for (const sz of [-1, 1]) PK.push([sx * (HX + .015), sz * (HZ + .015), .065]); PK.push([0, HZ + .03, .06], [0, -HZ - .03, .06]);
    for (const c of PK) { const d = new THREE.Mesh(new THREE.CircleGeometry(c[2] * 1.02, 28), dark); d.rotation.x = -Math.PI / 2; d.position.set(c[0], .003, c[1]); scene.add(d) }
    const KB = []; for (const s of [-1, 1]) { KB.push([.07, s * HZ], [-.07, s * HZ], [HX - .09, s * HZ], [-(HX - .09), s * HZ], [s * HX, HZ - .09], [s * HX, -(HZ - .09)]) }
    /* ---------- bola ---------- */
    const COL = ['', '#f2c230', '#1e4fb5', '#c8281e', '#5a2a86', '#e8742a', '#1f7a3d', '#7a1f1f', '#111'];

    }
    /* ---------- stik ---------- */

    {
      const a = new THREE.Mesh(new THREE.CylinderGeometry(.005, .009, .7, 16), new THREE.MeshStandardMaterial({ color: 0xe2c08a, roughness: .5 })), b = new THREE.Mesh(new THREE.CylinderGeometry(.009, .014, .7, 16), new THREE.MeshStandardMaterial({ color: 0x2b1a10, roughness: .4 }));
      for (const [m, x] of [[a, -.35], [b, -1.05]]) { m.rotation.z = -Math.PI / 2; m.position.x = x; m.castShadow = true; cin.add(m) }
      const tip = new THREE.Mesh(new THREE.CylinderGeometry(.0052, .0052, .008, 12), new THREE.MeshStandardMaterial({ color: 0x3b6ea8 })); tip.rotation.z = -Math.PI / 2; tip.position.x = .004; cin.add(tip)
    }
    scene.add(cue);
    /* ---------- status ---------- */
    const S = { mode: 'p', state: 'menu', cp: 0, grp: [null, null], aim: 0, pull: 0, pd: 0, st: 0, ox: 0, oy: 0, paused: true, msg: '', fouls: [0, 0], shots: 0, pots: 0, cam: 0, shot: null, settle: 0, sens: 1, my8: false, low: 1 };
    const cm = { yaw: 0, pitch: 0, dist: 1 }, sm = { az: -1.57, el: .5, d: 2.6, x: 0, z: 0 };
    const inG = (id, g) => g == 's' ? id >= 1 && id <= 7 : id >= 9;
    const free = (b, x, z) => balls.every(o => o === b || o.out || o.off || Math.hypot(o.p.x - x, o.p.z - z) > 2.02 * R);
    function spot(b, x, z) { b.out = false; b.fall = 0; b.mesh.visible = true; b.mesh.scale.setScalar(1); b.v.set(0, 0, 0); b.w.set(0, 0, 0); for (let t = 0; t < 40; t++) { const zz = z + (t % 2 ? 1 : -1) * Math.ceil(t / 2) * 2.1 * R; if (free(b, x, zz)) { b.p.set(x, R, zz); return } } b.p.set(x, R, z) }
    const sh = a => a.sort(() => Math.random() - .5);
    function setup(m) {
      S.mode = m; S.cp = 0; S.grp = [null, null]; S.fouls = [0, 0]; S.shots = 0; S.pots = 0; S.aim = 0; S.pull = 0; S.pd = 0; S.shot = null; S.msg = m == 'p' ? 'Latihan bebas.' : 'Pemain 1 memecah rak.';
      for (const b of balls) { b.out = false; b.fall = 0; b.off = m == '9' && b.id > 9; b.mesh.visible = !b.off; b.mesh.scale.setScalar(1); b.v.set(0, 0, 0); b.w.set(0, 0, 0); b.mesh.quaternion.setFromEuler(new THREE.Euler(Math.random() * 6, Math.random() * 6, Math.random() * 6)) }

      else { const s = sh([1, 2, 3, 4, 5, 6, 7]), t = sh([9, 10, 11, 12, 13, 14, 15]), rest = sh([...s.slice(1), ...t.slice(1)]); ord = []; let k = 0; for (let i = 0; i < 15; i++)ord[i] = i == 4 ? 8 : i == 10 ? s[0] : i == 14 ? t[0] : rest[k++] }
      let i = 0; (m == '9' ? [1, 2, 3, 2, 1] : [1, 2, 3, 4, 5]).forEach((n, c) => { for (let j = 0; j < n; j++)balls[ord[i++]].p.set(.635 + c * R * 1.7325, R, (j - (n - 1) / 2) * (2 * R + .0004)) });

    }

    }

    /* ---------- aturan ---------- */
    function fire() {

    function resolve() {

      if (m == 'p') { S.pots += pk.filter(i => i).length; S.msg = sc ? 'Bola putih masuk, dikembalikan.' : ''; if (sc) spot(balls[0], -.635, 0); if (!balls.some(b => b.id && !b.out)) S.msg = 'Meja bersih. Tekan R untuk menyusun ulang.'; S.state = 'aim'; return }
      let why = '', win = -1;
      if (sc) why = 'bola putih masuk'; else if (sh.first === null) why = 'tidak mengenai bola';
      else if (m == '8') { const g = S.grp[cp]; if (g ? !(inG(sh.first, g) || (S.my8 && sh.first == 8)) : sh.first == 8) why = 'bola pertama salah' }
      else if (sh.first != S.low) why = 'bola pertama salah';
      if (!why && !pk.length && !sh.rail) why = 'tidak ada bola menyentuh bantalan';
      if (m == '8') {
        if (pk.includes(8)) { if (S.shots == 1) spot(balls[8], .635, 0); else win = (why || !S.my8) ? 1 - cp : cp }
        if (!S.grp[cp] && !why) { const f = pk.find(i => i && i != 8); if (f) { S.grp[cp] = f < 8 ? 's' : 't'; S.grp[1 - cp] = f < 8 ? 't' : 's' } }
      }
      else if (pk.includes(9)) { if (why) spot(balls[9], .635, 0); else win = cp }
      const g = S.grp[cp], goOn = !why && (m == '8' ? pk.some(i => i && i != 8 && inG(i, g)) : pk.some(i => i));
      if (why) S.fouls[cp]++; if (win >= 0) { end(win); return }
      if (why || !goOn) S.cp = 1 - cp;
      S.msg = why ? `Foul: ${why}. Pemain ${S.cp + 1} menaruh bola putih (geser, lalu tekan Taruh bola).` : goOn ? 'Lanjut menembak.' : 'Giliran berganti.';
      if (sc) spot(balls[0], -.635, 0); S.state = why ? 'place' : 'aim'
    }
    /* ---------- UI ---------- */
    const OV = $('#ov'), sp = $('#spin');
    function ov(t, s, btns) {
      S.paused = true; OV.className = 'ov'; OV.innerHTML = `<h1>${t}</h1><p>${s}</p><div class="bt"></div><div><label>Suara <input id="vol" type="range" min="0" max="1" step=".05" value="${vol}"></label> <label>Sensitivitas <input id="sens" type="range" min=".3" max="2.5" step=".1" value="${S.sens}"></label></div>`;
      const bt = OV.querySelector('.bt'); for (const [l, f] of btns) { const b = document.createElement('button'); b.textContent = l; b.onclick = () => { au(); fs(); f() }; bt.appendChild(b) }
      $('#vol').oninput = e => vol = +e.target.value; $('#sens').oninput = e => S.sens = +e.target.value
    }
    function hideOv() { OV.className = 'ov hide'; S.paused = false }
    function start(m) { setup(m); hideOv() }
    function menu() { setup('8'); S.state = 'menu'; ov('Biliar', 'Tanpa garis bidik. Geser layar untuk membidik, tarik bilah Daya di kanan ke bawah lalu lepas untuk memukul. Lingkaran kiri mengatur titik pukul.', [['Latihan', () => start('p')], ['8-Ball', () => start('8')], ['9-Ball', () => start('9')]]) }
    function pause() { if (S.state == 'menu' || S.state == 'over' || S.paused) return; ov('Jeda', '', [['Lanjut', hideOv], ['Mulai ulang', () => start(S.mode)], ['Menu', menu]]) }
    let hudT = ''; function hud() {
      const g = S.grp[S.cp], nm = { p: 'Latihan', '8': '8-Ball', '9': '9-Ball' }[S.mode];
      const t = `<b>${nm}</b> ${S.mode == 'p' ? `Tembakan ${S.shots}, masuk ${S.pots}` : `Giliran pemain ${S.cp + 1}${g ? (g == 's' ? ' (solid)' : ' (stripe)') : ''}, foul ${S.fouls[0]} : ${S.fouls[1]}`}<br>${S.msg}`; if (t != hudT) { hudT = t; $('#hud').innerHTML = t }
    }
    function drawSpin() { const g = sp.getContext('2d'); g.clearRect(0, 0, 184, 184); g.fillStyle = '#f4f1ea'; g.beginPath(); g.arc(92, 92, 90, 0, 7); g.fill(); g.strokeStyle = '#bbb'; g.beginPath(); g.moveTo(92, 6); g.lineTo(92, 178); g.moveTo(6, 92); g.lineTo(178, 92); g.stroke(); g.fillStyle = '#c33'; g.beginPath(); g.arc(92 + S.ox * 76, 92 - S.oy * 76, 9, 0, 7); g.fill() }
    function spinPt(e) { const r = sp.getBoundingClientRect(); let x = (e.clientX - r.left) / r.width * 2 - 1, y = -((e.clientY - r.top) / r.height * 2 - 1); const l = Math.hypot(x, y); if (l > .95) { x *= .95 / l; y *= .95 / l } S.ox = x; S.oy = y; drawSpin() }
    sp.onpointerdown = e => { sp.setPointerCapture(e.pointerId); spinPt(e) }; sp.onpointermove = e => { if (e.buttons) spinPt(e) }; drawSpin();
    /* ---------- input sentuh ---------- */
    const keys = {}, rc = new THREE.Raycaster(), pl = new THREE.Plane(new THREE.Vector3(0, 1, 0), -R), pt = new THREE.Vector3(), cv = renderer.domElement, tp = new Map(), cl = (v, a, b) => Math.max(a, Math.min(b, v));
    let y0 = 0, pwH = 160;
    function au() { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.resume) AC.resume() }
    function fs() { try { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().then(() => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => { }) }).catch(() => { }) } catch (_) { } }
    function placeAt(e) { rc.setFromCamera({ x: e.clientX / innerWidth * 2 - 1, y: -(e.clientY / innerHeight * 2 - 1) }, camera); if (rc.ray.intersectPlane(pl, pt)) { const x = cl(pt.x, -HX + .1, HX - .1), z = cl(pt.z, -HZ + .1, HZ - .1); if (free(balls[0], x, z)) balls[0].p.set(x, R, z) } }
    // geser 1 jari: bidik (atau geser bola putih saat foul); 2 jari: cubit untuk zoom; mode orbit: geser untuk memutar kamera
    cv.onpointerdown = e => { if (S.paused) return; cv.setPointerCapture(e.pointerId); tp.set(e.pointerId, { x: e.clientX, y: e.clientY }); au(); if (S.state == 'place' && tp.size == 1) placeAt(e) };
    cv.onpointermove = e => {
      const o = tp.get(e.pointerId); if (!o || S.paused) return; const dx = e.clientX - o.x, dy = e.clientY - o.y;
      if (tp.size > 1) { const a = [...tp.values()], d0 = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); o.x = e.clientX; o.y = e.clientY; const d1 = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); if (d0 > 20 && d1 > 20) cm.dist = cl(cm.dist * d0 / d1, .5, 2.2); return }
      o.x = e.clientX; o.y = e.clientY;
      if (S.state == 'place') placeAt(e);
      else if (S.cam == 2) { cm.yaw -= dx * .006; cm.pitch = cl(cm.pitch + dy * .004, -.25, 1) }
      else if (S.state == 'aim') { S.aim += dx * .0045 * S.sens; if (S.cam == 0) cm.pitch = cl(cm.pitch + dy * .003, -.25, 1) }
    };
    cv.onpointerup = cv.onpointercancel = e => { tp.delete(e.pointerId) };
    // bilah daya: tarik ke bawah lalu lepas untuk memukul
    const pw = $('#pw'), pf = $('#pf'), bp = $('#bp');
    pw.onpointerdown = e => { if (S.paused || S.state != 'aim') return; pw.setPointerCapture(e.pointerId); au(); S.state = 'pull'; y0 = e.clientY; S.pull = 0; pwH = pw.getBoundingClientRect().height * .8 };
    pw.onpointermove = e => { if (S.state == 'pull') S.pull = cl((e.clientY - y0) / pwH, 0, 1) };
    pw.onpointerup = () => { if (S.state != 'pull') return; if (S.pull < .03) { S.state = 'aim'; S.pull = 0 } else { S.state = 'strike'; S.st = 0 } };
    pw.onpointercancel = () => { if (S.state == 'pull') { S.state = 'aim'; S.pull = 0 } };
    for (const [id, k] of [['fl', 'fa'], ['fr', 'fd']]) { const b = $('#' + id); b.onpointerdown = e => { e.preventDefault(); b.setPointerCapture(e.pointerId); keys[k] = true }; b.onpointerup = b.onpointercancel = () => { keys[k] = false } }
    bp.onclick = () => { if (S.state == 'place') { S.state = 'aim'; S.msg = '' } };
    $('#bc').onclick = e => { S.cam = (S.cam + 1) % 3; e.target.textContent = ['Kamera: bidik', 'Kamera: atas', 'Kamera: orbit'][S.cam] };
    $('#bz').onclick = pause;
    document.addEventListener('visibilitychange', () => { if (document.hidden) pause() });
    function ui() { bp.classList.toggle('hide', S.state != 'place'); pf.style.height = S.pull * 100 + '%' }
    /* ---------- loop ---------- */
    const qq = new THREE.Quaternion(), ax = new THREE.Vector3(); let last = performance.now(), acc = 0;
    function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix() } addEventListener('resize', () => { resize(); if (innerHeight > innerWidth) pause() }); resize();
    function frame(now) {
      requestAnimationFrame(frame); const dt = Math.min(.05, (now - last) / 1000); last = now; const c = balls[0];
      if (!S.paused) {
        if (S.state == 'aim') { const r = keys.Shift ? .07 : .45; if (keys.fa) S.aim -= .09 * dt; if (keys.fd) S.aim += .09 * dt }
        if (S.state == 'strike') { S.st += dt; S.pd = S.pull * .25 * Math.max(0, 1 - S.st / .07); if (S.st >= .07) fire() }
        if (S.state == 'roll') {
          acc += dt; let n = 0; while (acc >= H && n < 48) { phys(); acc -= H; n++ } if (acc > H * 48) acc = 0;
          for (const b of balls) { const l = b.w.length(); if (l > 1e-4 && !b.out) { qq.setFromAxisAngle(ax.copy(b.w).normalize(), l * n * H); b.mesh.quaternion.premultiply(qq) } }
          if (balls.some(b => !b.out && !b.off && (b.v.x || b.v.z))) S.settle = 0; else if ((S.settle += dt) > .35) resolve()
        }
      }
      for (const b of balls) {
        if (b.fall > 0 && !S.paused) { b.fall += dt; const t = Math.min(1, b.fall / .4), k = Math.min(1, dt * 10); b.p.x += (b.fc[0] - b.p.x) * k; b.p.z += (b.fc[1] - b.p.z) * k; b.mesh.position.set(b.p.x, R - .1 * t * t, b.p.z); b.mesh.scale.setScalar(1 - t * .6); if (t >= 1) { b.mesh.visible = false; b.fall = 0 } }
        else if (!b.out) b.mesh.position.set(b.p.x, R, b.p.z)
      }
      // stik: posisi mengikuti titik pukul yang dipilih, bukan garis bantu
      const sa = S.state, show = sa == 'aim' || sa == 'pull' || sa == 'strike'; cue.visible = show;
      if (show) { const pd = sa == 'pull' ? S.pull * .25 : S.pd, d = [Math.cos(S.aim), Math.sin(S.aim)], a = S.ox * .55 * R, gap = R + .008 + pd; cue.position.set(c.p.x - d[0] * gap - d[1] * a, R + S.oy * .55 * R, c.p.z - d[1] * gap + d[0] * a); cue.rotation.y = -S.aim }
      // kamera halus
      let az, el, dist, tx = sm.x, tz = sm.z;
      if (S.cam == 0) { az = S.aim + cm.yaw; el = .36 + cm.pitch; dist = .8 * cm.dist; if (S.state != 'roll') { tx = c.p.x; tz = c.p.z } }
      else if (S.cam == 1) { az = -Math.PI / 2; el = 1.3; dist = 2.5 * cm.dist; tx = tz = 0 }
      else { az = -Math.PI / 2 + cm.yaw; el = .55 + cm.pitch; dist = 2.6 * cm.dist; tx = tz = 0 }
      const k = 1 - Math.exp(-dt * 6); sm.az += (az - sm.az) * k; sm.el += (Math.min(1.45, Math.max(.1, el)) - sm.el) * k; sm.d += (dist - sm.d) * k; sm.x += (tx - sm.x) * k; sm.z += (tz - sm.z) * k;
      camera.position.set(sm.x - Math.cos(sm.az) * Math.cos(sm.el) * sm.d, Math.max(.14, Math.sin(sm.el) * sm.d), sm.z - Math.sin(sm.az) * Math.cos(sm.el) * sm.d); camera.lookAt(sm.x, .02, sm.z);
      hud(); ui(); renderer.render(scene, camera)
    }
    menu(); requestAnimationFrame(frame);
  </script>
